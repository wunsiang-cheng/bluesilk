<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bluesilk</title>
<style>
:root{--ph:#5cf;--bg:#040814;--dim:#163b5e;--hi:#e4f6ff}  /* blue phosphor: the default, it's bluesilk */
.green{--ph:#3f6;--bg:#070b07;--dim:#1a4d27;--hi:#e6ffe9}
.amber{--ph:#fb0;--bg:#0f0a00;--dim:#5c4300;--hi:#fff3d0}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000}
body{color:var(--ph);font:15px/1.45 "Cascadia Mono","IBM Plex Mono","Fira Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;text-shadow:0 0 5px var(--ph)}
#crt{position:fixed;inset:0;display:flex;flex-direction:column;padding:22px 26px;background:var(--bg);border-radius:22px;box-shadow:inset 0 0 100px #000,inset 0 0 8px var(--dim);overflow:hidden}
#crt::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
#crt::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65));animation:flicker 6s infinite}
@keyframes flicker{0%,100%{opacity:1}93%{opacity:1}94%{opacity:.7}95%{opacity:1}}
@media(prefers-reduced-motion:no-preference){#crt{animation:poweron .8s ease-out}}
@keyframes poweron{from{transform:scaleY(.004) scaleX(1.4);filter:brightness(6)}45%{transform:scaleY(1) scaleX(1.02);filter:brightness(2.5)}to{transform:none;filter:none}}
.logo{color:var(--hi);text-shadow:0 0 5px var(--hi);font-size:clamp(7px,2.2vw,15px);line-height:1.15;margin-bottom:.8em}
#out{flex:1;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere;scrollbar-width:none}
.u{color:var(--hi);text-shadow:0 0 5px var(--hi)}
.s{opacity:.6}
.t{opacity:.4}
b{color:var(--hi)} code,pre.k{color:var(--hi)} pre.k{margin:2px 0;padding:0 0 0 2ch;border-left:2px solid var(--dim);white-space:pre-wrap}
a{color:inherit}
#top{display:flex;justify-content:space-between;gap:1ch;opacity:.7;border-bottom:1px solid var(--dim);padding-bottom:5px;margin-bottom:8px;white-space:pre}
#st{opacity:.7;min-height:1.45em;white-space:pre-wrap;border-top:1px solid var(--dim);padding-top:5px;margin-top:8px}
#ln{display:flex}
#ps{white-space:pre}
#in,#pw{flex:1;background:0;border:0;outline:0;color:inherit;font:inherit;text-shadow:inherit;resize:none;padding:0;height:1.45em;max-height:40vh;caret-color:var(--ph)}
#cfg{position:absolute;inset:0;z-index:1;background:var(--bg);padding:22px 26px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
#cfg label{display:block;margin:12px 0 3px}
#cfg input,#cfg textarea{width:100%;background:0;border:1px solid var(--dim);color:inherit;font:inherit;text-shadow:inherit;padding:4px 6px;outline:0}
#cfg .check{display:inline-block;margin-right:20px}#cfg .check input{width:auto;margin-right:7px}
#cfg input:focus,#cfg textarea:focus{border-color:var(--ph)}
#cfg button{background:0;border:1px solid var(--ph);color:inherit;font:inherit;text-shadow:inherit;padding:4px 12px;margin:16px 8px 0 0;cursor:pointer}
#cfg button:hover{background:var(--dim)}
#err{color:#f66;text-shadow:0 0 5px #f66;margin-top:8px;white-space:pre-wrap}
@media(max-width:600px){#crt,#cfg{padding:12px 14px;border-radius:0}}
</style>
<div id="crt">
 <div id="top"><span id="who">BLUESILK</span><span id="link"></span><span id="clk"></span></div>
 <div id="out"></div>
 <div id="st"></div>
 <div id="ln"><span id="ps">LOGIN&gt; </span><textarea id="in" autofocus autocomplete="off" spellcheck="false" rows="1"></textarea><input id="pw" type="password" autocomplete="off" hidden></div>
 <input type="file" id="file" multiple hidden>
 <form id="cfg" hidden>
  <div>== SETTINGS == <span class="s">blank secrets keep their current value; saving restarts bluesilk</span></div>
  <label>OPENROUTER API KEY</label><input name="api_key" type="password" autocomplete="off">
  <label>MODEL <span class="s">an openrouter.ai/models slug that supports tools; blank = the default</span></label><input name="model">
  <label>TELEGRAM USER IDS <span class="s">comma-separated, each must have pressed Start on the bot; empty = no Telegram</span></label><input name="user_ids">
  <label>TELEGRAM BOT TOKEN</label><input name="bot_token" type="password" autocomplete="off">
  <label>WEB CONSOLE MEMBERS <span class="s">names, comma-separated; empty = no web console</span></label><input name="members">
  <label>WEB HOST / PORT <span class="s">127.0.0.1 = this machine only; anything else is plain http on your network</span></label>
  <div style="display:flex;gap:8px"><input name="host"><input name="port" style="width:8ch"></div>
  <label>PASSWORDS <span class="s">each member picks one on their first login; tick to make them pick again</span></label><div id="mem" class="s"></div>
  <label>MCP.JSON</label><textarea name="mcp" rows="6" spellcheck="false"></textarea>
  <div id="err"></div>
  <button type="submit">SAVE &amp; RESTART</button><button type="button" id="cancel">CANCEL</button>
 </form>
</div>
<script>
const $=id=>document.getElementById(id),out=$('out'),st=$('st'),inp=$('in'),pw=$('pw'),cfg=$('cfg');
let es,typing=false,seen=false,pending=null,stText='',stSince=0,lastTool='';const tq=[];
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/```(?:\w*\n)?([\s\S]*?)```/g,'<pre class="k">$1</pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>')
 .replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/(^|[^\w])_([^_\n]+)_(?=[^\w]|$)/g,'$1<i>$2</i>');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function line(html,cls){const d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=html;out.append(d);out.scrollTop=out.scrollHeight;return d}
function type(html,cls){tq.push([html,cls]);typing||next()}
function next(){  // typewriter: the text nodes are emptied, then refilled a few chars per frame, one message at a time
 const it=tq.shift();if(!it)return typing=false;typing=true;
 const d=line(...it),w=document.createTreeWalker(d,NodeFilter.SHOW_TEXT),nodes=[];let n,total=0,i=0;
 while(n=w.nextNode()){nodes.push([n,n.data]);total+=n.data.length;n.data=''}
 const step=Math.max(2,Math.ceil(total/150));  // integer: a fractional step makes substr/i drift and skip chars
 (function tick(){let b=step;while(b>0&&nodes.length){const[nd,s]=nodes[0],k=Math.min(b,s.length-i);nd.data+=s.substr(i,k);i+=k;b-=k;if(i>=s.length){nodes.shift();i=0}}
  out.scrollTop=out.scrollHeight;nodes.length?requestAnimationFrame(tick):next()})();
}
function status(t){  // the line above the prompt: what the agent is doing now and for how long; a tool call also stays in the transcript
 if(t!==stText){stText=t;stSince=Date.now()}
 if(!t)lastTool='';else if(t!=='…'&&t!==lastTool&&!/^(STOPPING|LINK LOST)|IN BACKGROUND$/.test(t))line(esc(lastTool=t),'t');
 draw();
}
function draw(){const ms=Date.now()-stSince;st.textContent=stText?'|/-\\'[Math.floor(ms/125)%4]+' '+(stText==='…'?'THINKING':stText)+' '+Math.floor(ms/1000)+'s':'';document.title=(stText?'● ':'')+'bluesilk';
 $('clk').textContent=new Date().toTimeString().slice(0,8)}
setInterval(draw,125);
function ask(prompt,secret){  // one answer from the prompt line; a secret one is typed into the password box
 $('ps').textContent=prompt;inp.hidden=!!secret;pw.hidden=!secret;(secret?pw:inp).focus();
 return new Promise(r=>pending=r);
}
const LOGO=[' ___  _     _   _  ___  ___  ___  _     _  __ ',
            '| _ )| |   | | | || __|/ __||_ _|| |   | |/ / ',
            '| _ \\| |__ | |_| || _| \\__ \\ | | | |__ | \' <  ',
            '|___/|____| \\___/ |___||___/|___||____||_|\\_\\ '];
async function boot(){
 try{document.documentElement.className=localStorage.theme||(localStorage.amber?'amber':'')}catch{}  // amber: the 0.8 toggle
 const d=line('','logo'),end=LOGO[0].length+6,step=matchMedia('(prefers-reduced-motion:reduce)').matches?end:1;
 for(let t=0;t<=end;t+=step){  // the loom: a rippling bolt of silk settles into the name, one column at a time
  d.textContent=LOGO.map((r,i)=>[...r].map((ch,c)=>c<t-6?ch:' ~-='[(Math.sin(c/2.5-t/1.2+i*1.6)*2+2)|0]).join('')).join('\n');
  await sleep(30)}
 for(const l of['MEM CHECK ........ OK','LINK ............. '+location.host]){line(l,'s');await sleep(160)}
 login();
}
async function login(){
 let r;try{r=await fetch('/settings')}catch{return setTimeout(login,1500)}  // restarting: try again
 if(r.status===401)return signin();
 const v=await r.json();
 v.setup?openCfg(v):connect();
}
async function signin(){
 const name=await ask('LOGIN> '),password=await ask('PASSWORD> ',true);
 let r=await post('/login',JSON.stringify({name,password}));
 if(!r.ok)return signin();
 if((await r.json()).confirm){  // first login: the password just typed becomes theirs once confirmed
  line('NEW MEMBER: THAT PASSWORD WILL BE YOURS. TYPE IT AGAIN.','s');
  const confirm=await ask('CONFIRM> ',true);
  r=await post('/login',JSON.stringify({name,password,confirm}));
  if(!r.ok)return signin();
  if((await r.json()).confirm){line('PASSWORDS DIFFER.','s');return signin()}
 }
 login();
}
function connect(){
 es?.close();es=new EventSource('/events');
 es.addEventListener('hello',e=>{const me=JSON.parse(e.data);if(seen)out.innerHTML='';seen=true;  // a reconnect replays history
  $('ps').textContent=me+'@bluesilk:~$ ';$('who').textContent='BLUESILK · '+me;line('LOGGED IN AS '+esc(me)+'. /help FOR COMMANDS.','s');inp.focus()});
 es.addEventListener('history',e=>{for(const[r,t]of JSON.parse(e.data))r==='tool'?line(esc(lastTool=t),'t'):line(r==='user'?esc($('ps').textContent+t):md(t),r==='user'?'u':'')});
 es.addEventListener('msg',e=>type(md(JSON.parse(e.data))));  // the status line was already cleared, or set to what runs on, just before
 es.addEventListener('status',e=>status(JSON.parse(e.data)));
 es.addEventListener('file',e=>{const d=JSON.parse(e.data),i=d.indexOf('/'),name=esc(d.slice(i+1));type(`[FILE] <a href="/file/${d.slice(0,i)}/${name}" target="_blank">${name}</a>`)});
 es.onerror=()=>{$('link').textContent='LINK LOST';if(es.readyState===2){line('LINK CLOSED.','s');login()}else status('LINK LOST, RETRYING')};
 es.onopen=()=>{status('');$('link').textContent='LINK OK'};
}
async function post(path,body){const r=await fetch(path,{method:'POST',body});if(!r.ok)line(esc(await r.text()),'s');return r}
inp.onkeydown=pw.onkeydown=async e=>{
 if(e.key==='Escape'){if(stText)status('STOPPING');return post('/stop')}
 if(e.ctrlKey&&e.key==='u'){e.preventDefault();return $('file').click()}
 if(e.key!=='Enter'||e.shiftKey)return;
 e.preventDefault();const el=e.target,t=el.value.trim();el.value='';inp.style.height='';
 if(pending){const r=pending;pending=null;if(el===inp)line(esc($('ps').textContent+t),'u');inp.hidden=false;pw.hidden=true;inp.focus();return r(t)}
 if(!t)return;
 line(esc($('ps').textContent+t),'u');
 if(t==='/help')return line('/new  /reset  /settings  /theme  /password  /logout  /help    Esc = stop    Ctrl+U, paste or drop = send a file','s');
 if(t==='/password'){const old=await ask('CURRENT PASSWORD> ',true),nw=await ask('NEW PASSWORD> ',true),confirm=await ask('CONFIRM> ',true);
  if(nw!==confirm)return line('PASSWORDS DIFFER.','s');
  if((await post('/password',JSON.stringify({old,new:nw}))).ok)line('PASSWORD CHANGED.','s');return}
 if(t==='/logout'){await post('/logout');es?.close();seen=false;out.innerHTML='';$('who').textContent='BLUESILK';$('link').textContent='';return login()}
 if(t==='/theme'){const h=document.documentElement,n=['','green','amber'],c=n[(n.indexOf(h.className)+1)%3];h.className=c;try{localStorage.theme=c}catch{}return}
 if(t==='/settings')return openCfg(await(await fetch('/settings')).json());
 send('/send',t);
};
async function send(path,body){  // a message sent during a turn waits its turn; the status line keeps showing the running one
 const r=await post(path,body);if(!r.ok)return;const q=(await r.json()).queued;
 q?line('QUEUED'+(q>1?', '+(q-1)+' AHEAD':''),'s'):status('…');
}
inp.oninput=()=>{inp.style.height='';inp.style.height=inp.scrollHeight+'px'};
document.onmouseup=e=>{if(cfg.hidden&&!e.target.closest('a')&&getSelection().isCollapsed)(pw.hidden?inp:pw).focus()};
async function upload(f){const cap=inp.value.trim();inp.value='';inp.style.height='';
 line(esc($('ps').textContent+'[sending '+f.name+'] '+cap),'u');
 send('/upload?name='+encodeURIComponent(f.name)+'&text='+encodeURIComponent(cap),f)}
$('file').onchange=e=>{for(const f of e.target.files)upload(f);e.target.value=''};
document.ondragover=e=>e.preventDefault();document.ondrop=e=>{e.preventDefault();for(const f of e.dataTransfer.files)upload(f)};
inp.onpaste=e=>{for(const f of e.clipboardData.files)upload(f)};
function openCfg(v){
 cfg.hidden=false;$('cancel').hidden=!!v.setup;$('err').textContent='';
 cfg.api_key.value=cfg.bot_token.value='';cfg.api_key.placeholder=v.api_key||'';cfg.bot_token.placeholder=v.bot_token||'';
 cfg.model.value=v.model;cfg.model.placeholder=v.default_model;cfg.user_ids.value=v.user_ids.join(', ');cfg.host.value=v.host;cfg.port.value=v.port;
 cfg.members.value=Object.keys(v.members).join(', ');cfg.mcp.value=v.mcp;
 $('mem').innerHTML=Object.entries(v.members).map(([n,set])=>`<label class="check"><input type="checkbox" name="reset" value="${esc(n)}">${esc(n)}: ${set?'SET':'NOT SET'}</label>`).join('')||'(members log in at '+location.origin+' once saved)';
 cfg.api_key.focus();
}
$('cancel').onclick=()=>{cfg.hidden=true;inp.focus()};
cfg.onsubmit=async e=>{
 e.preventDefault();$('err').textContent='VALIDATING…';
 const f=Object.fromEntries(new FormData(cfg));f.reset=[...cfg.querySelectorAll('[name=reset]:checked')].map(x=>x.value).join(' ');
 const r=await fetch('/settings',{method:'POST',body:JSON.stringify(f)});
 if(!r.ok)return $('err').textContent=await r.text();
 const v=await r.json();cfg.hidden=true;es?.close();
 line('SAVED. RESTARTING…','s');
 line('MEMBERS LOG IN AT '+location.origin+' WITH THEIR NAME. A NEW MEMBER PICKS A PASSWORD ON THE FIRST LOGIN.','s');
 setTimeout(login,2000);
};
boot();
</script>
