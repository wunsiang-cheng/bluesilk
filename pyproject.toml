[project]
name = "bluesilk"
version = "0.8.0"
description = "A fast, minimal AI agent for you or a small team: OpenRouter + Telegram or a web console."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.urls]
Repository = "https://github.com/wunsiang-cheng/bluesilk"

[project.scripts]
bluesilk = "bluesilk:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["bluesilk"]

[tool.hatch.build.targets.sdist]
only-include = ["bluesilk", "tests", "README.md", "LICENSE"]  # never ship .env
